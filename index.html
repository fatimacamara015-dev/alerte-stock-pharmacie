<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerte Stock Pharmacie</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f7f6;
      color: #1f2a24;
      margin: 0;
      padding: 24px 16px;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px;
      color: #0b6e4f;
    }
    p {
      margin: 0 0 20px;
      color: #5b6b63;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1.05rem;
    }
    th, td {
      text-align: left;
      padding: 12px 8px;
      border-bottom: 1px solid #e3e8e5;
    }
    th {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #5b6b63;
    }
    td.quantite, th.quantite {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr.stock-bas td {
      color: #c0392b;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #fdecea;
      color: #c0392b;
      font-size: 0.8rem;
      font-weight: 600;
    }
    form {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e3e8e5;
    }
    h2 {
      font-size: 1.1rem;
      margin: 0 0 12px;
      color: #1f2a24;
    }
    .champs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: #5b6b63;
    }
    label:first-child {
      flex: 1 1 200px;
    }
    label:nth-child(2) {
      width: 100px;
    }
    input {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid #c9d2cd;
      border-radius: 8px;
      color: #1f2a24;
    }
    input:focus-visible {
      outline: 2px solid #0b6e4f;
      outline-offset: 1px;
    }
    button {
      font: inherit;
      font-weight: 600;
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      background: #0b6e4f;
      color: #ffffff;
      cursor: pointer;
    }
    button:hover {
      background: #095a41;
    }
  </style>
</head>
<body>
  <main>
    <h1>Stock de la pharmacie</h1>
    <p>Quantités actuellement disponibles</p>

    <table>
      <thead>
        <tr>
          <th>Médicament</th>
          <th class="quantite">Quantité en stock</th>
        </tr>
      </thead>
      <tbody id="liste-stock"></tbody>
    </table>

    <form id="formulaire-ajout">
      <h2>Ajouter un médicament</h2>
      <div class="champs">
        <label>
          Nom
          <input type="text" id="nom" required placeholder="Ex. Métronidazole 250 mg">
        </label>
        <label>
          Quantité
          <input type="number" id="quantite" required min="0" step="1" placeholder="0">
        </label>
        <button type="submit">Ajouter</button>
      </div>
    </form>
  </main>

  <script>
    const medicaments = [
      { nom: "Paracétamol 500 mg", quantite: 120 },
      { nom: "Amoxicilline 500 mg", quantite: 6 },
      { nom: "Artéméther-Luméfantrine (antipaludique)", quantite: 3 },
      { nom: "Sels de réhydratation orale (SRO)", quantite: 80 },
      { nom: "Ibuprofène 400 mg", quantite: 60 }
    ];

    const SEUIL_STOCK_BAS = 10; // en nombre de boîtes

    const tbody = document.getElementById("liste-stock");

    function afficherMedicament(med) {
      const ligne = document.createElement("tr");
      const stockBas = med.quantite < SEUIL_STOCK_BAS;
      if (stockBas) {
        ligne.className = "stock-bas";
      }

      const celluleNom = document.createElement("td");
      celluleNom.textContent = med.nom; // textContent : pas d'injection HTML
      if (stockBas) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "Stock bas";
        celluleNom.appendChild(badge);
      }

      const celluleQuantite = document.createElement("td");
      celluleQuantite.className = "quantite";
      celluleQuantite.textContent = med.quantite;

      ligne.appendChild(celluleNom);
      ligne.appendChild(celluleQuantite);
      tbody.appendChild(ligne);
    }

    medicaments.forEach(afficherMedicament);

    const formulaire = document.getElementById("formulaire-ajout");
    const champNom = document.getElementById("nom");
    const champQuantite = document.getElementById("quantite");

    formulaire.addEventListener("submit", function (evenement) {
      evenement.preventDefault();

      const nom = champNom.value.trim();
      const quantite = parseInt(champQuantite.value, 10);
      if (nom === "" || isNaN(quantite) || quantite < 0) {
        return;
      }

      const med = { nom: nom, quantite: quantite };
      medicaments.push(med);
      afficherMedicament(med);

      formulaire.reset();
      champNom.focus();
    });
  </script>
</body>
</html>
